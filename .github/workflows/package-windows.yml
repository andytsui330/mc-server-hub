{
  "name": "Build unsigned Windows installer candidate",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "package": {
      "if": "${{ github.repository == 'andytsui330/mc-server-hub' && !github.event.repository.private && github.ref == 'refs/heads/main' }}",
      "runs-on": "windows-2025",
      "timeout-minutes": 45,
      "env": {
        "PYTHONIOENCODING": "utf-8"
      },
      "defaults": {
        "run": {
          "shell": "pwsh"
        }
      },
      "permissions": {
        "contents": "read",
        "id-token": "write",
        "attestations": "write"
      },
      "steps": [
        {
          "name": "Isolate app data folder",
          "run": "$dir = Join-Path $env:RUNNER_TEMP \"mchub-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT\"\nNew-Item -ItemType Directory -Force -Path $dir | Out-Null\n\"MCHUB_DATA_DIR=$dir\" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1",
          "with": {
            "node-version": "24.18.0",
            "cache": "npm",
            "cache-dependency-path": "app/package-lock.json"
          }
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.14"
          }
        },
        {
          "name": "Install pinned Rust toolchain",
          "run": "rustup toolchain install 1.99.1 --profile minimal --component clippy"
        },
        {
          "name": "Resolve locked dependencies",
          "run": "npm ci --ignore-scripts --prefix app\ncargo fetch --locked --target x86_64-pc-windows-msvc"
        },
        {
          "name": "Prepare licenses, SBOM and release notes",
          "run": "python -B scripts/release_support.py prepare"
        },
        {
          "name": "Packaging contract tests",
          "run": "python -B -m unittest discover -s tests -p test_release_support.py -v"
        },
        {
          "name": "Build isolated-test candidate (no signing secrets)",
          "run": "python -B scripts/release_support.py build-windows-test --allow-tool-download"
        },
        {
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-path": "target/windows-candidate-*/MCServerHub-Setup-Windows.exe",
            "create-storage-record": false
          }
        },
        {
          "uses": "actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6",
          "with": {
            "subject-path": "target/windows-candidate-*/MCServerHub-Setup-Windows.exe",
            "sbom-path": "target/release-support/SBOM.cdx.json",
            "create-storage-record": false
          }
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "unsigned-windows-installer-${{ github.sha }}",
            "path": "target/windows-candidate-*/*",
            "if-no-files-found": "error",
            "retention-days": 14
          }
        }
      ]
    }
  }
}
